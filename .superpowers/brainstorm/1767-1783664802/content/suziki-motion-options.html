<h2>SUZIKI 铃木：动作表现方式</h2>
<p class="subtitle">无论选择哪种，都会产出 Codex 所需的 9 个状态动作和 16 个朝向；不会加入文字、阴影、速度线或漂浮特效。</p>

<div class="options">
  <div class="option" data-choice="subtle" onclick="toggleSelect(this)">

  </div>

  </div>
